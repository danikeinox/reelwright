version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      remotion:
        patterns: ["remotion", "@remotion/*"]
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      dev:
        dependency-type: development
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
